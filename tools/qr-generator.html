<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - ToolX Pro</title>
    <meta name="description" content="Generate high-quality customized QR codes for websites, links, texts, or phone numbers and download them as PNG.">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Load QRious Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>
    <div id="app-container">
        <header id="main-header"></header>
        
        <div class="main-wrapper">
            <aside id="main-sidebar"></aside>
            
            <main class="content-area">
                <div class="tool-container">
                    <div class="tool-header">
                        <h1 class="tool-title">🔳 QR Code Generator</h1>
                        <p class="tool-desc">Enter your website URL or text contents below to instantly generate a custom QR code.</p>
                    </div>
                    
                    <div class="tool-body">
                        <div class="form-group">
                            <label for="qr-text">Website Link or Text Content:</label>
                            <textarea id="qr-text" class="form-control" rows="3" placeholder="e.g. https://google.com or enter any message..." required></textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="qr-size">QR Code Size (px):</label>
                                <select id="qr-size" class="form-control">
                                    <option value="150">150 × 150 (Small)</option>
                                    <option value="250" selected>250 × 250 (Medium)</option>
                                    <option value="350">350 × 350 (Large)</option>
                                    <option value="500">500 × 500 (HD Quality)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="qr-color">Foreground Color:</label>
                                <input type="color" id="qr-color" class="form-control" style="height:42px; padding:2px;" value="#000000">
                            </div>
                        </div>
                        
                        <button id="generate-btn" class="btn btn-primary">Generate QR Code 🚀</button>
                    </div>
                    
                    <div id="results" class="results-card" style="text-align:center;">
                        <h2 class="results-title" style="justify-content:center;">📊 Your QR Code</h2>
                        <div class="results-content" id="results-content" style="display:flex; flex-direction:column; align-items:center; gap:15px; margin-top:1rem;">
                            <canvas id="qr-canvas"></canvas>
                            <button id="download-btn" class="btn btn-primary" style="width:auto; min-width:200px;">📥 Download Image (PNG)</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <footer id="main-footer"></footer>
    </div>
    
    <script src="../js/layout.js"></script>
    <script src="../js/tools/qr-generator.js"></script>
</body>
</html>
