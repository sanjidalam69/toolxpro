<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF - ToolX Pro</title>
    <meta name="description" content="Convert and compile multiple images (JPG, PNG, WebP) into a single clean PDF document online.">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Load jsPDF from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="app-container">
        <header id="main-header"></header>
        
        <div class="main-wrapper">
            <aside id="main-sidebar"></aside>
            
            <main class="content-area">
                <div class="tool-container">
                    <div class="tool-header">
                        <h1 class="tool-title">📄 Image to PDF</h1>
                        <p class="tool-desc">Arrange your uploaded pictures and compile them into a clean PDF document.</p>
                    </div>
                    
                    <div class="tool-body">
                        <!-- Drag and Drop Upload Area -->
                        <div class="upload-area" id="drop-area">
                            <span class="upload-icon">📄</span>
                            <h3 style="font-size:1.1rem; font-weight:600;">Drag & drop multiple images here or click to browse</h3>
                            <p style="font-size:0.85rem; color:var(--text-secondary);">Supports: JPG, JPEG, PNG, WebP (You can select multiple files at once)</p>
                            <input type="file" id="image-upload" accept="image/*" multiple style="display:none;">
                        </div>

                        <!-- Settings & Preview Area -->
                        <div id="settings-area" style="display:none; margin-top:1.5rem; animation: fadeIn 0.3s;">
                            <!-- PDF Settings Form -->
                            <div class="form-row" style="background:var(--bg-secondary); padding:1rem; border-radius:8px; border:1px solid var(--border-color); margin-bottom:1.2rem;">
                                <div class="form-group">
                                    <label for="pdf-page-size">Page Size:</label>
                                    <select id="pdf-page-size" class="form-control">
                                        <option value="a4">A4 (Standard)</option>
                                        <option value="letter">Letter</option>
                                        <option value="fit">Auto Fit (Match Image Size)</option>
                                    </select>
                                }
                                </div>
                                <div class="form-group">
                                    <label for="pdf-orientation">Orientation:</label>
                                    <select id="pdf-orientation" class="form-control">
                                        <option value="p">Portrait (Vertical)</option>
                                        <option value="l">Landscape (Horizontal)</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="pdf-margin">Margin:</label>
                                    <select id="pdf-margin" class="form-control">
                                        <option value="0">No Margin (0px)</option>
                                        <option value="10">Small Margin (10px)</option>
                                        <option value="20">Standard Margin (20px)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Uploaded Images List -->
                            <h3 style="font-size:1.1rem; font-weight:600; margin-bottom:8px;">Uploaded Images:</h3>
                            <div class="file-list" id="images-list">
                                <!-- Dynamically added images list -->
                            </div>

                            <button id="create-pdf-btn" class="btn btn-primary" style="margin-top:1.2rem;">Create PDF Document 🚀</button>
                        </div>
                    </div>
                    
                    <div id="results" class="results-card">
                        <h2 class="results-title">📊 PDF Compilation Complete</h2>
                        <div class="results-content" id="results-content">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <footer id="main-footer"></footer>
    </div>
    
    <script src="../js/layout.js"></script>
    <script src="../js/tools/image-to-pdf.js"></script>
</body>
</html>
