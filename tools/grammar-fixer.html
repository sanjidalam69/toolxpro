<body>
    <div id="app-container">
        <header id="main-header"></header>
        
        <div class="main-wrapper">
            <aside id="main-sidebar"></aside>
            
            <main class="content-area">
                <div class="ai-tool-wrapper">
                    <!-- Ambient Glow Effect -->
                    <div class="ai-ambient-glow"></div>

                    <div class="ai-card">
                        
                        <!-- AI Header -->
                        <div class="ai-hero-header" style="margin-bottom: 20px;">
                            <h1 class="ai-tool-title">✨ AI Grammar & Paraphraser</h1>
                            <p class="ai-tool-subtitle">Fix grammar and spelling mistakes, or intelligently rephrase and polish your text instantly.</p>
                            <div style="margin-top:12px;">
                                <a href="ai-humanizer.html" style="display:inline-flex; align-items:center; gap:6px; background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.25); padding:5px 14px; border-radius:20px; font-size:0.8rem; font-weight:700; color:#059669; text-decoration:none; transition:var(--transition);" onmouseover="this.style.background='rgba(16,185,129,0.15)'" onmouseout="this.style.background='rgba(16,185,129,0.08)'">
                                    <span>🛡️ Bypass AI Detectors? <strong>AI Humanizer ➔</strong></span>
                                </a>
                            </div>
                        </div>
                        
                        <!-- AI Tone / Mode Picker Chips -->
                        <div class="ai-modes-section">
                            <div class="ai-modes-label">
                                <span>🎯 Select Mode:</span>
                                <span id="active-mode-label" style="color:#8b5cf6; font-size:0.8rem; font-weight:700;">Grammar & Spell Fix</span>
                            </div>
                            <div class="ai-mode-chips">
                                <button type="button" class="ai-chip active" data-tone="standard" data-title="Grammar & Spell Fix">
                                    <span class="ai-chip-icon">✨</span>
                                    <span>Fix Grammar</span>
                                </button>
                                <button type="button" class="ai-chip" data-tone="paraphrase" data-title="Paraphrase & Rewrite">
                                    <span class="ai-chip-icon">🔄</span>
                                    <span>Paraphrase</span>
                                </button>
                                <button type="button" class="ai-chip" data-tone="formal" data-title="Professional Polish">
                                    <span class="ai-chip-icon">👔</span>
                                    <span>Professional</span>
                                </button>
                            </div>
                        </div>

                        <!-- AI Smart Input Canvas -->
                        <div class="ai-input-container">
                            <div class="ai-input-header">
                                <div class="ai-input-title">
                                    <span>📝 Original Text</span>
                                </div>
                                <div class="ai-quick-actions">
                                    <button type="button" id="paste-btn" class="btn-ai-pill">📋 Paste</button>
                                    <button type="button" id="clear-btn" class="btn-ai-pill">🧹 Clear</button>
                                </div>
                            </div>

                            <textarea id="input-text" class="ai-textarea" placeholder="Paste or type your text here..." maxlength="4000"></textarea>

                            <div class="ai-input-hud">
                                <div class="hud-metrics">
                                    <span class="hud-metric-item" id="word-count">📝 0 words</span>
                                </div>
                                <div>
                                    <span id="char-count">0 / 4000 chars</span>
                                </div>
                            </div>
                        </div>

                        <!-- AI Action Shimmer Button -->
                        <div class="ai-action-btn-wrapper">
                            <button type="button" id="fix-btn" class="ai-magic-btn">
                                <span class="sparkle-icon" id="btn-icon">✦</span>
                                <span id="btn-text">Run AI Deep Proofread & Polish</span>
                            </button>
                        </div>

                        <div id="ai-thinking" class="ai-thinking-box">
                            <div class="thinking-wave-bar">
                                <div class="thinking-wave-indicator"></div>
                            </div>
                            <div class="thinking-steps">
                                <div class="thinking-step" id="step-1">
                                    <span>🔍</span> <span>Scanning syntax</span>
                                </div>
                                <div class="thinking-step" id="step-2">
                                    <span>⚡</span> <span>Neural analysis</span>
                                </div>
                                <div class="thinking-step" id="step-3">
                                    <span>✨</span> <span>Polishing tone</span>
                                </div>
                            </div>
                        </div>

                        <div id="status-msg" style="margin-top:14px; font-size:0.9rem; text-align:center; font-weight:600;"></div>

                        <!-- ═══════════════════════════════════════════════════════
                             AI RESULTS HUB
                             ═══════════════════════════════════════════════════════ -->
                        <div id="results" class="ai-results-hub">
                            
                            <!-- Tabs Switcher -->
                            <div class="ai-result-tabs">
                                <button type="button" class="ai-tab-btn active" data-tab="tab-corrected">
                                    <span>✨</span> Output Text
                                </button>
                                <button type="button" class="ai-tab-btn" data-tab="tab-manuscript">
                                    <span>🔍</span> Changes (Diff)
                                </button>
                                <button type="button" class="ai-tab-btn" data-tab="tab-notes">
                                    <span>💡</span> Explanations (<span id="notes-badge-count">0</span>)
                                </button>
                            </div>

                            <!-- Tab 1: Corrected Output -->
                            <div id="tab-corrected" class="ai-tab-content active">
                                <div class="output-box-wrapper">
                                    <textarea id="output-text" class="output-textarea" readonly></textarea>
                                </div>
                            </div>

                            <!-- Tab 2: Comparison Markup -->
                            <div id="tab-manuscript" class="ai-tab-content">
                                <div id="manuscript-markup" class="ai-manuscript-box"></div>
                            </div>

                            <!-- Tab 3: Margin Notes -->
                            <div id="tab-notes" class="ai-tab-content">
                                <div id="margin-notes-list" class="notes-list"></div>
                            </div>

                            <!-- Action Buttons Footer -->
                            <div class="results-actions-footer">
                                <div class="footer-left-actions">
                                    <button type="button" id="tts-btn" class="btn-action-tool">
                                        <span id="tts-icon">🔊</span>
                                        <span id="tts-text">Read Aloud</span>
                                        <div class="audio-wave" id="audio-wave">
                                            <div class="audio-bar"></div>
                                            <div class="audio-bar"></div>
                                            <div class="audio-bar"></div>
                                        </div>
                                    </button>
                                    <button type="button" id="download-btn" class="btn-action-tool">⬇️ Download (.txt)</button>
                                </div>
                                <div class="footer-right-actions">
                                    <button type="button" id="replace-input-btn" class="btn-action-tool">🔄 Replace in Input</button>
                                    <button type="button" id="copy-btn" class="btn-action-tool btn-primary-action">📋 Copy Polished Text</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <footer id="main-footer"></footer>
